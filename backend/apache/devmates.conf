<VirtualHost *:80>
    ServerAdmin webmaster@devmates.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Journaux d'accès et d'erreurs Apache
    ErrorLog ${APACHE_LOG_DIR}/devmates_error.log
    CustomLog ${APACHE_LOG_DIR}/devmates_access.log combined
</VirtualHost>
