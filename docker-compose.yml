# Orchestration Docker pour le projet DevMates
# Services : base de données MySQL, API PHP, client web React

services:

  db:
    image: mysql:8.0
    container_name: devmates_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: devmates
      MYSQL_USER: ${DB_USER:-devmates_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devmates_secret}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/devmates_db.sql:/docker-entrypoint-initdb.d/01_devmates_db.sql
    ports:
      - "3306:3306"
    networks:
      - devmates_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devmates_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: devmates
      DB_USER: ${DB_USER:-devmates_user}
      DB_PASSWORD: ${DB_PASSWORD:-devmates_secret}
      JWT_SECRET: ${JWT_SECRET:-changez_ce_secret_en_production_32_chars}
    volumes:
      - ./backend/src:/var/www/html
    ports:
      - "8080:80"
    networks:
      - devmates_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devmates_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - devmates_network

volumes:
  db_data:
    driver: local

networks:
  devmates_network:
    driver: bridge
